name: Documentation issue
description: Report missing, stale, or misleading JST documentation.
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      placeholder: https://github.com/jst-stack/jst/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should the reader be able to do?
    validations:
      required: true
