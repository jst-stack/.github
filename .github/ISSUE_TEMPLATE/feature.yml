name: Feature proposal
description: Propose a user-visible capability after checking existing discussions.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the current user workflow and concrete limitation, not the preferred implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and maintenance cost
      description: Note defaults, migrations, dependencies, CI, and documentation that would change.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched Issues and Discussions for this request.
          required: true
        - label: I am willing to help validate or implement the proposal.
